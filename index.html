<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paleta — design systems that start with an intention</title>
    <meta name="description" content="Describe your brand in plain language. paleta generates a complete OKLCH color system — scales, tokens, contrast, and components." />
    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="paleta" />
    <meta property="og:description" content="Design systems that start with an intention." />
    <meta property="og:url"         content="https://paleta-nine.vercel.app" />
    <meta property="og:image"       content="https://paleta-nine.vercel.app/api/og" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter / X -->
    <meta name="twitter:card"  content="summary_large_image" />
    <meta name="twitter:title" content="paleta" />
    <meta name="twitter:image" content="https://paleta-nine.vercel.app/api/og" />
    <!-- Avoid flash of wrong theme before React mounts -->
    <script>
      (function () {
        var s = localStorage.getItem('paleta-theme')
        var t = s || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
